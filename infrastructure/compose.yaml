# Shared local infrastructure for the lab experiments.
#
# Experiments include this file from their own compose.yaml, so the project
# name (and therefore container, network and volume names) comes from the
# experiment, e.g. "drlab-e01". Run on its own, it uses "drlab-infra".
#
# Credentials are local-only lab values. Nothing here is meant for production.
# No PostgreSQL host port is published; use `docker compose exec postgres psql`.

name: drlab-infra

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    # A fixed hostname keeps the RabbitMQ node name (and its data) stable
    # across container stop/start.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    ports:
      # Management UI/API, loopback only, non-default host port to avoid
      # colliding with other local stacks.
      - "127.0.0.1:${DRLAB_RABBITMQ_UI_PORT:-15682}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  rabbitmq-data:
